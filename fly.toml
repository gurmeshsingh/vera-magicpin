# Fly.io deployment. Equivalent posture to render.yaml.
app = "vera-magicpin-gs"
primary_region = "sin"     # Singapore: nearest region to an India-run harness

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Both must stay off. A machine that stops between ticks loses the context
  # store, and the judge's next healthz lands on a cold start.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "20s"
  timeout = "4s"
  grace_period = "5s"
  method = "GET"
  path = "/v1/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
